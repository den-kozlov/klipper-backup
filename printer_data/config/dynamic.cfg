
[gcode_macro CALIBRATE_TOOL_OFFSETS_DYN]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tool_count = svv.active_tools %}
    {% set tool_temp = params.TOOL_TEMPERATURE|default(200)|float %}
    # Handle different tool count scenarios explicitly
    {% if tool_count == 0 %}
      RESPOND MSG="No print heads detected. Check configuration."
    {% elif tool_count == 1 %}
      RESPOND MSG="Only one print head installed. Calibration requires more than one."
    {% elif tool_count == 2 %}
      {% set msg = "Detected 2 print heads. Heating both to " + tool_temp + "°C before calibration." %}
      RESPOND MSG={msg}
      T0
      M104 S{tool_temp}  # Heat Tool 0
      T1
      M104 S{tool_temp}  # Heat Tool 1
      T0
      M109 S{tool_temp}  # Wait until Tool 0 is at target temp
      T1
      M109 S{tool_temp}  # Wait until Tool 1 is at target temp
      RESPOND MSG="Starting calibration for 2 print heads."
      G28
      _CAL_SELECT_T0
      _CALIBRATE_MOVE_OVER_PROBE
      TOOL_LOCATE_SENSOR
      M104 S0
      SAVE_GCODE_STATE NAME=SENSOR_LOCATION
      _CAL_DOCK_T0
      {% for tool in [1] %}
        _CAL_SELECT_T{tool}
        RESTORE_GCODE_STATE NAME=SENSOR_LOCATION MOVE=1 MOVE_SPEED=150
        TOOL_CALIBRATE_TOOL_OFFSET_{tool}
        M104 S0
        _CAL_DOCK_T{tool}
      {% endfor %}
      SAVE_CONFIG
    {% elif tool_count == 3 %}
      {% set msg = "Detected 2 print heads. Heating both to " + tool_temp + "°C before calibration." %}
      RESPOND MSG={msg}
      T0
      M104 S{tool_temp}  # Heat Tool 0
      T1
      M104 S{tool_temp}  # Heat Tool 1
      T2
      M104 S{tool_temp}  # Heat Tool 2
      T0
      M109 S{tool_temp}  # Wait until Tool 0 is at target temp
      T1
      M109 S{tool_temp}  # Wait until Tool 1 is at target temp
      T2
      M109 S{tool_temp}  # Wait until Tool 2 is at target temp
      RESPOND MSG="Starting calibration for 3 print heads."
      G28
      _CAL_SELECT_T0
      _CALIBRATE_MOVE_OVER_PROBE
      TOOL_LOCATE_SENSOR
      M104 S0
      SAVE_GCODE_STATE NAME=SENSOR_LOCATION
      _CAL_DOCK_T0
      {% for tool in [1, 2] %}
        _CAL_SELECT_T{tool}
        RESTORE_GCODE_STATE NAME=SENSOR_LOCATION MOVE=1 MOVE_SPEED=150
        TOOL_CALIBRATE_TOOL_OFFSET_{tool}
        M104 S0
        _CAL_DOCK_T{tool}
      {% endfor %}
      SAVE_CONFIG
    {% else %}
      RESPOND MSG="Error: Unexpected tool count. Check configuration."
    {% endif %}

